<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 532" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw harness runtime loop</title>
  <desc id="desc">A research profile feeds the deterministic supervisor. Watchdog reviews independently on one side; self-improvement is an advisory sidecar on the other. The supervisor runs a deterministic task or a bounded agent turn, writes the evidence ledger, then quality review routes to continue, blocker or fallback, or a canary implementation path.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="531" rx="14" fill="#0b1220" stroke="#334155" stroke-width="1"/>

  <!-- Research profile -->
  <rect x="240" y="22" width="360" height="56" rx="8" fill="#0f3d4c" stroke="#5eead4" stroke-width="1.5"/>
  <text x="420" y="45" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Research profile</text>
  <text x="420" y="63" text-anchor="middle" fill="#99f6e4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">objective · metrics · lanes · sources · scope</text>

  <path d="M420 78 V102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Watchdog -->
  <rect x="24" y="106" width="184" height="56" rx="8" fill="#2d2a4a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="116" y="129" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Watchdog</text>
  <text x="116" y="147" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">independent review</text>

  <!-- Supervisor -->
  <rect x="240" y="106" width="360" height="56" rx="8" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="420" y="139" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Deterministic supervisor</text>

  <!-- Self-improvement -->
  <rect x="632" y="106" width="184" height="56" rx="8" fill="#2d2a4a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="724" y="129" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Self-improvement</text>
  <text x="724" y="147" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">advisory sidecar</text>

  <path d="M208 134 H236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600 134 H628" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M292 162 V190" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M548 162 V190" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Work paths -->
  <rect x="200" y="194" width="184" height="56" rx="8" fill="#1e2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="292" y="217" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Deterministic task</text>
  <text x="292" y="235" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">benchmark / review / source</text>

  <rect x="456" y="194" width="184" height="56" rx="8" fill="#1e2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="548" y="217" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Bounded agent turn</text>
  <text x="548" y="235" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">model-bound reasoning</text>

  <path d="M292 250 V278" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M548 250 V278" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Evidence -->
  <rect x="240" y="282" width="360" height="50" rx="8" fill="#1a3d2f" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="420" y="312" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Evidence ledger</text>

  <path d="M420 332 V360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Review -->
  <rect x="240" y="364" width="360" height="50" rx="8" fill="#3d2f1f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="420" y="394" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Quality review</text>

  <path d="M300 414 H222 V444" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M420 414 V444" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M540 414 H628 V444" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Outcomes stay inside the viewBox -->
  <rect x="148" y="448" width="148" height="36" rx="8" fill="#0f3d4c" stroke="#5eead4" stroke-width="1.5"/>
  <text x="222" y="471" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">continue</text>

  <rect x="336" y="448" width="168" height="36" rx="8" fill="#1e2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="471" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">blocker / fallback</text>

  <rect x="544" y="448" width="168" height="36" rx="8" fill="#3d2f1f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="628" y="471" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">canary</text>
</svg>
