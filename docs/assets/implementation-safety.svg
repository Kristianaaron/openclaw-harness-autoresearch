<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 444" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw implementation safety path</title>
  <desc id="desc">An idea becomes a scoped patch, then a path and secret scan, canary workspace, focused tests, and rollback check. Risk tier sends safe or moderate work to a promotion score, and architectural work through a required sandbox first. The score either promotes the change or rejects and quarantines it.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="443" rx="14" fill="#0b1220" stroke="#334155" stroke-width="1"/>

  <!-- Gate path: six equal steps -->
  <rect x="16" y="24" width="128" height="58" rx="8" fill="#0f3d4c" stroke="#5eead4" stroke-width="1.5"/>
  <text x="80" y="58" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Idea</text>

  <rect x="156" y="24" width="128" height="58" rx="8" fill="#1e2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="51" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Scoped</text>
  <text x="220" y="69" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">patch</text>

  <rect x="296" y="24" width="128" height="58" rx="8" fill="#1e2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="51" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Path + secret</text>
  <text x="360" y="69" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">scan</text>

  <rect x="436" y="24" width="128" height="58" rx="8" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="500" y="51" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Canary</text>
  <text x="500" y="69" text-anchor="middle" fill="#bae6fd" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">workspace</text>

  <rect x="576" y="24" width="128" height="58" rx="8" fill="#1e2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="51" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Focused</text>
  <text x="640" y="69" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">tests</text>

  <rect x="716" y="24" width="128" height="58" rx="8" fill="#1a3d2f" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="780" y="51" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Rollback</text>
  <text x="780" y="69" text-anchor="middle" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">check</text>

  <path d="M144 53 H152" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M284 53 H292" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M424 53 H432" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M564 53 H572" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M704 53 H712" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M780 82 V118 H430 V134" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Risk tier -->
  <rect x="262" y="138" width="336" height="58" rx="8" fill="#3d2f1f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="430" y="165" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Risk tier</text>
  <text x="430" y="183" text-anchor="middle" fill="#fde68a" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">safe / moderate, or architectural</text>

  <path d="M350 196 V220" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M510 196 V220" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Split -->
  <rect x="196" y="224" width="188" height="50" rx="8" fill="#1e2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="254" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">safe / moderate</text>

  <rect x="476" y="224" width="188" height="50" rx="8" fill="#2d2a4a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="570" y="247" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">architectural</text>
  <text x="570" y="263" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">sandbox required</text>

  <path d="M290 274 V298" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M570 274 V298" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Promotion score -->
  <rect x="262" y="302" width="336" height="42" rx="8" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="430" y="328" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Promotion score</text>

  <path d="M350 344 V368" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M510 344 V368" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="326" y="362" text-anchor="end" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">pass</text>
  <text x="534" y="362" text-anchor="start" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">fail</text>

  <!-- Outcomes -->
  <rect x="196" y="372" width="188" height="36" rx="8" fill="#1a3d2f" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="290" y="395" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Promote</text>

  <rect x="476" y="372" width="188" height="36" rx="8" fill="#3f1d24" stroke="#fb7185" stroke-width="1.5"/>
  <text x="570" y="395" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Reject / quarantine</text>
</svg>
